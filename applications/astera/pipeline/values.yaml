nameOverride: pipeline

replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: oldentomato/astera-pipeline
  tag: "sha-pending"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: dockerhub-pull

service:
  type: ClusterIP
  port: 5678
  targetPort: 5678

persistence:
  enabled: false

secret:
  enabled: true
  name: astera-pipeline-secrets
  encryptedData:
    ASTERA_BACKUP_RETENTION_DAYS: 
    ASTERA_FETCH_CONCURRENCY: 
    ASTERA_HASHTAG_EDGES: 
    ASTERA_MEDIA_LIMIT: ""
    ASTERA_TARGET_HASHTAGS: ""
    ASTERA_TARGET_KEYWORDS: ""
    DB_POSTGRESDB_DATABASE: ""
    DB_POSTGRESDB_HOST: ""
    DB_POSTGRESDB_PASSWORD: ""
    DB_POSTGRESDB_PORT: ""
    DB_POSTGRESDB_SCHEMA: ""
    DB_POSTGRESDB_USER: ""
    DB_TYPE: 
    GENERIC_TIMEZONE: 
    INSTAGRAM_ACCESS_TOKEN: ""
    INSTAGRAM_APP_ID: ""
    INSTAGRAM_APP_SECRET: ""
    INSTAGRAM_PAGE_ID: 
    KAKAO_REST_API_KEY: ""
    N8N_ENCRYPTION_KEY: 
    N8N_HOST: ""
    N8N_INSTANCE_OWNER_EMAIL: ""
    N8N_INSTANCE_OWNER_FIRST_NAME: ""
    N8N_INSTANCE_OWNER_LAST_NAME: ""
    N8N_INSTANCE_OWNER_MANAGED_BY_ENV: 
    N8N_INSTANCE_OWNER_PASSWORD_HASH: ""
    N8N_PORT: 
    N8N_PROTOCOL: 
    N8N_RUNNERS_TASK_TIMEOUT: ""
    OPENAI_API_KEY: ""
    OPENAI_MODEL: ""
    WEBHOOK_URL: 

# 비밀번호와 DB 접속 정보는 secret.encryptedData 에만 둔다.
env:
  - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
    value: "false"