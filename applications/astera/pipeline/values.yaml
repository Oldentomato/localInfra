nameOverride: pipeline
replicaCount: 1
revisionHistoryLimit: 3
image:
  repository: oldentomato/astera-pipeline
  tag: "sha-ca5dd61"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: dockerhub-pull
service:
  type: ClusterIP
  port: 5678
  targetPort: 5678
persistence:
  enabled: false
secret:
  enabled: true
  name: astera-pipeline-secrets
  encryptedData:
    ASTERA_BACKUP_RETENTION_DAYS: 
    ASTERA_FETCH_CONCURRENCY: 
    ASTERA_HASHTAG_EDGES: 
    ASTERA_MEDIA_LIMIT: ""
    ASTERA_TARGET_HASHTAGS: ""
    ASTERA_TARGET_KEYWORDS: ""
    GENERIC_TIMEZONE: 
    INSTAGRAM_ACCESS_TOKEN: ""
    INSTAGRAM_APP_ID: ""
    INSTAGRAM_APP_SECRET: ""
    INSTAGRAM_PAGE_ID: 
    KAKAO_REST_API_KEY: ""
    N8N_ENCRYPTION_KEY: 
    N8N_HOST: ""
    N8N_PORT: 
    N8N_PROTOCOL: 
    N8N_RUNNERS_TASK_TIMEOUT: ""
    OPENAI_API_KEY: ""
    OPENAI_MODEL: ""
    WEBHOOK_URL: 

# n8n 2.x 는 이 값이 정확히 false 가 아니면 노드의 $env 접근을 막는다.
# Resolve Instagram Account 등이 $env.INSTAGRAM_* 를 읽는다.
env:
  - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
    value: "false"
