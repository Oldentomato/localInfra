nameOverride: back

replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: oldentomato/tomato-studio-back
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

persistence:
  enabled: false

secret:
  enabled: true
  name: tomato-studio-back-secrets
  encryptedData:
    DATABASE_URL: 
    TOMATO_DOCKER_HOST: 
    TOMATO_DOCKER_SSH_PASSWORD: 
    TOMATO_OPENAI_API_KEY: 
